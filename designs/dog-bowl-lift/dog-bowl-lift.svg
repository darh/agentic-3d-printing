<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840">
  <title>Dog bowl lift tripod - concept sketch v3</title>
  <desc>Three-arm top platform with one integral threaded leg at each arm end. Matching female threads are printed into the arm nubs. No separate hardware. Dimensions in millimeters.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#dbe5ee" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8Z" fill="#334155"/>
    </marker>
    <style>
      .sheet{fill:#f8fafc}.panel{fill:url(#grid);stroke:#94a3b8;stroke-width:2}
      .title{font:700 25px system-ui,sans-serif;fill:#0f172a}.sub{font:15px system-ui,sans-serif;fill:#475569}
      .pt{font:700 18px system-ui,sans-serif;fill:#0f172a}.label{font:15px system-ui,sans-serif;fill:#334155}
      .small{font:13px system-ui,sans-serif;fill:#475569}.known{font:700 14px system-ui,sans-serif;fill:#0f766e}
      .tbd{font:700 14px system-ui,sans-serif;fill:#b45309}.warn{font:700 14px system-ui,sans-serif;fill:#b91c1c}
      .arm{stroke:#0f766e;stroke-width:44;stroke-linecap:round}.armFill{fill:#0f766e;stroke:#115e59;stroke-width:2}.archWeb{fill:#5eead4;stroke:#115e59;stroke-width:2}.slot{fill:#f8fafc;stroke:#115e59;stroke-width:2}.armedge{fill:#99f6e4;stroke:#115e59;stroke-width:3}
      .hub{fill:#ccfbf1;stroke:#115e59;stroke-width:3}.nub{fill:#fed7aa;stroke:#c2410c;stroke-width:3}
      .leg{fill:#dbeafe;stroke:#1d4ed8;stroke-width:3}.thread{fill:#bfdbfe;stroke:#1d4ed8;stroke-width:2}
      .bowl{fill:#fff;fill-opacity:.62;stroke:#64748b;stroke-width:3;stroke-dasharray:10 7}
      .dim{stroke:#334155;stroke-width:2;marker-start:url(#arrow);marker-end:url(#arrow)}
      .ext{stroke:#64748b;stroke-width:1.5}.center{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:7 5}
      .leader{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect class="sheet" width="1200" height="840"/>
  <text class="title" x="35" y="42">DOG BOWL LIFT - TRIPOD CONCEPT v3</text>
  <text class="sub" x="35" y="68">Three arms at 120 deg; each arm tip has an integral female thread for a leg with an integral diameter 10 male thread.</text>
  <text class="sub" x="35" y="91">All dimensions in mm. Green = specified, orange = unresolved, red = measurement conflict to resolve.</text>

  <g id="top-view">
    <rect class="panel" x="30" y="115" width="555" height="520" rx="8"/>
    <text class="pt" x="50" y="145">TOP VIEW - PROPELLER PLATFORM</text>
    <line class="center" x1="308" y1="375" x2="308" y2="160"/>
    <line class="center" x1="308" y1="375" x2="120" y2="484"/>
    <line class="center" x1="308" y1="375" x2="496" y2="484"/>
    <path class="archWeb" d="M308 179Q290.22 364.66 138 473Q308 395.68 478 473Q325.78 364.66 308 179Z"/>
    <path class="armFill" d="M261.45 375L285.95 179L330.05 179L354.55 375Z"/>
    <path class="armFill" d="M284.73 334.69L126.98 453.90L149.03 492.10L331.28 415.31Z"/>
    <path class="armFill" d="M284.73 415.31L466.98 492.10L489.03 453.90L331.28 334.69Z"/>
    <path class="slot" d="M308 223.1C300 219 293.3 224 293.3 231.7C293.3 238 297.5 241 301.9 240.3V299C297.5 298 293.3 301.5 293.3 307.6C293.3 315 300 320 308 316.2C316 320 322.7 315 322.7 307.6C322.7 301.5 318.5 298 314.1 299V240.3C318.5 241 322.7 238 322.7 231.7C322.7 224 316 219 308 223.1Z"/>
    <path class="slot" d="M308 223.1C300 219 293.3 224 293.3 231.7C293.3 238 297.5 241 301.9 240.3V299C297.5 298 293.3 301.5 293.3 307.6C293.3 315 300 320 308 316.2C316 320 322.7 315 322.7 307.6C322.7 301.5 318.5 298 314.1 299V240.3C318.5 241 322.7 238 322.7 231.7C322.7 224 316 219 308 223.1Z" transform="rotate(120 308 375)"/>
    <path class="slot" d="M308 223.1C300 219 293.3 224 293.3 231.7C293.3 238 297.5 241 301.9 240.3V299C297.5 298 293.3 301.5 293.3 307.6C293.3 315 300 320 308 316.2C316 320 322.7 315 322.7 307.6C322.7 301.5 318.5 298 314.1 299V240.3C318.5 241 322.7 238 322.7 231.7C322.7 224 316 219 308 223.1Z" transform="rotate(240 308 375)"/>
    <circle class="hub" cx="308" cy="375" r="35"/>
    <circle class="slot" cx="308" cy="375" r="24.5"/>
    <circle class="nub" cx="308" cy="179" r="24.5"/>
    <circle class="nub" cx="138" cy="473" r="24.5"/>
    <circle class="nub" cx="478" cy="473" r="24.5"/>
    <circle cx="308" cy="179" r="5" fill="#1d4ed8"/>
    <circle cx="138" cy="473" r="5" fill="#1d4ed8"/>
    <circle cx="478" cy="473" r="5" fill="#1d4ed8"/>
    <circle class="bowl" cx="308" cy="375" r="196"/>
    <text class="label" x="308" y="587" text-anchor="middle">dashed reference: bowl diameter 160 (from notebook)</text>
    <line class="ext" x1="328" y1="375" x2="380" y2="375"/>
    <line class="ext" x1="328" y1="179" x2="380" y2="179"/>
    <line class="dim" x1="365" y1="375" x2="365" y2="179"/>
    <text class="known" x="378" y="283">R80 arm</text>
    <text class="small" x="378" y="301">center to nub axis</text>
    <text class="known" x="378" y="319">3 dog-bone holes: 12 x 38</text>
    <text class="known" x="308" y="407" text-anchor="middle">3 x inverted arch R160</text>
    <path class="ext" d="M308 305 A70 70 0 0 1 369 410" fill="none"/>
    <text class="known" x="366" y="337">120 deg</text>
    <path class="leader" d="M500 190L326 183"/>
    <text class="label" x="405" y="167">retaining nub + enclosed leg socket</text>
    <text class="known" x="405" y="187">diameter 20 hemisphere on full boss</text>
    <rect x="48" y="542" width="505" height="70" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text class="tbd" x="62" y="566">BOWL PROFILE CHECK</text>
    <text class="small" x="62" y="588">R80 is confirmed to each nub center; platform outside diameter is about 180.</text>
    <text class="small" x="62" y="606">Measure the bowl underside at nub height to set retention clearance.</text>
  </g>

  <g id="side-view">
    <rect class="panel" x="610" y="115" width="560" height="350" rx="8"/>
    <text class="pt" x="630" y="145">SIDE VIEW - TWO OF THREE LEGS VISIBLE</text>
    <path class="armedge" d="M675 232H1105V256H675Z"/>
    <path class="nub" d="M679 232A13.5 13.5 0 0 1 706 232Z"/>
    <path class="nub" d="M1074 232A13.5 13.5 0 0 1 1101 232Z"/>
    <path class="bowl" d="M700 177H1080C1060 218 1010 233 890 233S720 218 700 177Z"/>
    <path class="leg" d="M685 256H700V428.5A7.5 7.5 0 0 1 685 428.5Z"/>
    <path class="leg" d="M1080 256H1095V428.5A7.5 7.5 0 0 1 1080 428.5Z"/>
    <rect class="thread" x="685" y="233" width="15" height="23"/>
    <rect class="thread" x="1080" y="233" width="15" height="23"/>
    <path d="M685 238L700 244M685 246L700 252M1080 238L1095 244M1080 246L1095 252" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    <line class="ext" x1="653" y1="256" x2="683" y2="256"/>
    <line class="ext" x1="653" y1="436" x2="683" y2="436"/>
    <line class="dim" x1="662" y1="256" x2="662" y2="436"/>
    <text class="known" x="648" y="352" text-anchor="middle" transform="rotate(-90 648 352)">120 leg body</text>
    <path class="leader" d="M780 295L700 248"/>
    <text class="known" x="790" y="291">15 long integral male thread</text>
    <text class="tbd" x="790" y="312">diameter 10; pitch / clearance TBD</text>
    <text class="known" x="790" y="345">Leg: round, diameter 10</text>
    <text class="known" x="790" y="365">Arm: 10 high, 38 to 18 taper</text>
    <text class="known" x="790" y="397">PLA, stock 0.4 nozzle</text>
    <text class="tbd" x="790" y="418">foot/end shape TBD</text>
  </g>

  <g id="joint-detail">
    <rect class="panel" x="610" y="490" width="255" height="315" rx="8"/>
    <text class="pt" x="630" y="520">ARM-TIP JOINT</text>
    <rect class="armedge" x="640" y="581" width="190" height="30" rx="15"/>
    <path class="nub" d="M753 581A21 21 0 0 1 795 581Z"/>
    <path d="M760 556V656H788V556" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>
    <rect class="thread" x="760" y="596" width="28" height="60"/>
    <path class="leg" d="M760 656H788V752A14 14 0 0 1 760 752Z"/>
    <path d="M760 601L788 611M760 613L788 623M760 625L788 635M760 637L788 647" fill="none" stroke="#1d4ed8" stroke-width="2"/>
    <path class="leader" d="M679 551L754 568"/>
    <text class="small" x="635" y="545">full diameter 20 boss</text>
    <text class="small" x="635" y="562">wraps printed female thread</text>
    <path class="leader" d="M694 709L760 689"/>
    <text class="small" x="635" y="705">leg screws in</text>
    <text class="small" x="635" y="722">from below; no hardware</text>
    <text class="tbd" x="630" y="790">Wall around thread TBD</text>
  </g>

  <g id="plan">
    <rect class="panel" x="890" y="490" width="280" height="315" rx="8"/>
    <text class="pt" x="910" y="520">MODELING PLAN</text>
    <text class="label" x="910" y="553">1. Measure bowl underside profile.</text>
    <text class="label" x="910" y="582">2. Set nub retention clearance.</text>
    <text class="label" x="910" y="611">3. Set printed thread pitch/fit.</text>
    <text class="label" x="910" y="640">4. Test boss/thread wall strength.</text>
    <text class="label" x="910" y="669">5. Build one symmetric top Body.</text>
    <text class="label" x="910" y="698">6. Build one leg Body; print x3.</text>
    <text class="label" x="910" y="727">7. Test-fit one joint first.</text>
    <text class="label" x="910" y="756">8. Validate/export for slicer.</text>
    <text class="small" x="910" y="787">Designed as 2 unique printed parts.</text>
  </g>
</svg>
